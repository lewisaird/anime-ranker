[build]
  # v1.0.261 — publish only the site's own files (tools/build-site.mjs copies them into dist/). Publishing the repo
  # root ("." until now) made function sources, tests, tools and docs downloadable; redirect rules can't hide them
  # reliably (static files are served in any letter case). A missing listed file fails the build, so the last good
  # deploy stays live. Functions are unaffected: they are built from netlify/functions, relative to the repo root.
  command = "node tools/build-site.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # v1.0.255 — Node 18 (April 2025) and 20 (April 2026) are end-of-life; 22 is supported to April 2027. Keep in step with .github/workflows/ci.yml.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Serve assetlinks.json via a function so the hidden .well-known folder
# doesn't need to be committed to the repo
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.netlify/functions/assetlinks"
  status = 200

# v1.0.249 — short share links. /s/<id> is the app shell; the client reads the
# id from the path and fetches the payload from the share function.
[[redirects]]
  from = "/s/*"
  to = "/index.html"
  status = 200
